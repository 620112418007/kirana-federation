// =====================================================================
// SESSION: one game = config + seed + the log of human answers.
// The engine is deterministic given those, so the same log rebuilds the game
// (save and resume), and every peer of an online game runs the same engine in lockstep.
// =====================================================================
const RULESETS = {
  '0.3': { label: 'ฉบับ 0.3', data: () => window.KDATA03, rules: {} },
  '0.3t5': { label: 'ฉบับ 0.3 จุดเปลี่ยนกระแส 5 (4 คน) / 4 (3 คน)', data: () => window.KDATA03, rules: { tip4: 5, tip3: 4 } },
  '0.2': { label: 'ฉบับ 0.2', data: () => window.KDATA02 || window.KDATA, rules: {} },
};
const rulesetOpts = cur => Object.entries(RULESETS).filter(([k, r]) => r.data()).map(([k, r]) => `<option value="${k}"${k === cur ? ' selected' : ''}>${esc(r.label)}</option>`).join('');
const TAKEOVER = { takeover: true };

function alive(tok) { if (tok !== token) throw new Error(ABORT); }
function encodeAns(req, v) {
  if (v === null || v === undefined) return { n: 1 };
  if (req.options) { const i = req.options.findIndex(o => same(o.value, v)); if (i >= 0) return { o: i }; }
  return { v: JSON.parse(JSON.stringify(v)) };
}
function decodeAns(req, e) {
  if (!e || e.n) return null;
  if (e.o != null && req.options && req.options[e.o]) return req.options[e.o].value;
  return e.v === undefined ? null : e.v;
}

// cfg = {mode, rules, seed, seats:[{name, latin, meaning, color, flag, leader, human, owner, style}], dice}
// seats are already in play order (the dice decided it), so the first player of round 1 is seat 0
function startGame(cfg, o) {
  o = o || {};
  token++; const tok = token;
  paused = false; pending = null; closeModal(); closeDialog2(); hideTip();
  const replay = o.replay ? new Map(o.replay.map(([k, v]) => [+k, v])) : null;
  S = { cfg, mode: cfg.mode, me: pubId(), seq: 0, log: new Map(), replay, replayMax: replay ? Math.max(0, ...replay.keys()) : 0, replaying: !!(replay && replay.size),
    takeover: Object.assign({}, o.takeover || {}), buffer: new Map(), waiting: null, net: o.net || null, room: o.room || null, yieldN: 0,
    tutorial: cfg.mode === 'tutorial' ? { seen: new Set(), on: true } : null, hashes: {}, chat: [], unread: 0 };
  if (S.net && S.net.attach) S.net.attach(S);
  const rs = RULESETS[cfg.rules] || RULESETS['0.3'];
  const seats = cfg.seats.map(s => ({ name: s.name, human: !!s.human, style: s.style || 'balanced', color: s.color }));
  G = K.newGame({ seats, seed: cfg.seed, data: rs.data(), rules: rs.rules, first: 0, io: { ask: (g, P, req) => ioAsk(tok, P, req), event: (g, ev, data) => ioEvent(tok, ev, data) } });
  G.ui = { watch: cfg.mode === 'watch', rules: rs.label };
  if (window.__fedTrace) { const orig = G.aiR; let n = 0; G.aiR = () => { n++; return orig(); }; G.__aiN = () => n; } // debug: count AI draws per ask
  audio();
  buildLayout();
  if (S.replaying) showReplayVeil(); else queueRender();
  K.runGame(G).catch(e => {
    if (e && e.message === ABORT) return;
    console.error(e);
    openModal(`<h2>เกิดข้อผิดพลาดในเอนจิน</h2><pre class="small" style="white-space:pre-wrap">${esc(e && e.stack || e)}</pre>
      <p class="small muted">ซีดของเกมนี้คือ ${G.seed} ส่งซีดกับข้อความนี้มาเพื่อไล่หาจุดผิดได้</p><div class="mfoot"><button class="btn" id="err-menu">กลับเมนู</button></div>`);
    modal.querySelector('#err-menu').onclick = () => showMenu();
  });
}
function leaveGame() {
  if (S && S.net && S.net.leave) S.net.leave();
  token++; G = null; S = null; pending = null; paused = false;
  closeModal(); closeDialog2(); hideTip();
}

async function ioAsk(tok, P, req) {
  alive(tok);
  const seq = ++S.seq;
  if (window.__fedTrace) window.__fedTrace.push([seq, P.id, req.kind, stateHash(), G.__aiN ? G.__aiN() : -1]);
  if (S.replay) {
    if (S.replay.has(seq)) { const e = S.replay.get(seq); S.log.set(seq, e); applyCtl(seq, e); if (++S.yieldN % 40 === 0) await sleep(0); return decodeAns(req, e); }
    if (seq > S.replayMax) endReplay();
  }
  const tk = S.takeover[P.id];
  if (!P.human || (tk && seq >= tk.from && (tk.to == null || seq <= tk.to))) return aiAnswer(tok, P, req);
  if (isMine(P)) {
    const asked = humanAsk(P, req, seq);
    if (S.tutorial) setTimeout(() => tutorialHook('ask:' + req.kind), 90);
    const v = await asked;
    alive(tok);
    const e = encodeAns(req, v);
    S.log.set(seq, e);
    if (S.net) S.net.sendAnswer(seq, P.id, e);
    applyCtl(seq, e);
    saveSoon();
    return v;
  }
  const e = await waitRemote(seq, P);
  alive(tok);
  if (e === TAKEOVER) return aiAnswer(tok, P, req);
  S.log.set(seq, e);
  applyCtl(seq, e);
  saveSoon();
  return decodeAns(req, e);
}
// controls ride on answers, so every peer applies them at the same point of the game
function applyCtl(seq, e) {
  if (!e || !e.c) return;
  for (const c of e.c) if (c.reclaim != null && S.takeover[c.reclaim] && S.takeover[c.reclaim].to == null) S.takeover[c.reclaim].to = seq;
}
async function aiAnswer(tok, P, req) {
  if (req.kind === 'turn' && !S.replaying) {
    queueRender();
    await sleep(settings.speed > 0 ? settings.speed : 0);
    while (paused) { await sleep(120); alive(tok); }
    alive(tok);
  } else if (S.replaying && ++S.yieldN % 40 === 0) await sleep(0);
  return AI.decide(G, P, req);
}
// a remote player's answer: it may arrive before this peer has reached that ask
function waitRemote(seq, P) {
  if (S.buffer.has(seq)) { const e = S.buffer.get(seq); S.buffer.delete(seq); return Promise.resolve(e); }
  return new Promise(res => { S.waiting = { seq, pid: P.id, res }; queueRender(); });
}
function deliverAnswer(seq, e) {
  if (!S || S.log.has(seq) || S.buffer.has(seq)) return false;
  if (S.waiting && S.waiting.seq === seq) { const w = S.waiting; S.waiting = null; w.res(e); queueRender(); return true; }
  if (seq > S.seq) { S.buffer.set(seq, e); return true; }
  return false;
}
// an AI takes over a seat for every ask after `after` (a dropped player); all peers apply it at the same ask
function applyTakeover(pid, from) {
  if (!S) return;
  const cur = S.takeover[pid];
  if (cur && cur.to == null && cur.from <= from) return;
  S.takeover[pid] = { from, to: null };
  const P = G && G.players[pid]; if (P) P._aiPlanned = null;
  if (S.waiting && S.waiting.pid === pid && S.waiting.seq >= from) { const w = S.waiting; S.waiting = null; w.res(TAKEOVER); }
  queueRender();
}

// AI suggestions for the human must not touch the game's AI random stream, or online peers would drift apart
function aiHint(P, req) {
  const sv = { r: G.aiR, st: P.style, pl: P._aiPlanned };
  G.aiR = K.rng((G.seed ^ Math.imul(S.seq + 7, 2654435761)) >>> 0);
  P.style = 'balanced'; P._aiPlanned = null;
  try { return AI.decide(G, P, req); }
  finally { G.aiR = sv.r; P.style = sv.st; P._aiPlanned = sv.pl; }
}
function aiIso(fn) {
  const r = G.aiR; G.aiR = K.rng((G.seed ^ Math.imul(S.seq + 11, 2246822519)) >>> 0);
  try { return fn(); } finally { G.aiR = r; }
}

// ---------- events from the engine ----------
async function ioEvent(tok, ev, data) {
  alive(tok);
  if (S.replaying) { if (ev === 'end') { endReplay(); } else { if (++S.yieldN % 60 === 0) await sleep(0); return; } }
  if (ev === 'fx' && data.t === 'round' && S.mode === 'online' && S.net && S.net.onRound) { const h = stateHash(); S.hashes[data.round] = h; S.net.onRound(data.round, h); }
  if (ev === 'fx') { await handleFx(data); alive(tok); }
  else if (ev === 'battle') {
    const h = meP();
    const mine = h && (data.sides[0].P === h || data.sides[1].P === h);
    if (S.tutorial && mine) await tutorialHook('battle');
    if (settings.battles === 'all' || (settings.battles === 'mine' && mine) || (S.tutorial && mine)) { queueRender(); await showBattle(data); alive(tok); }
  } else if (ev === 'end') {
    queueRender(); clearSave();
    if (S.net && S.net.onEnd) S.net.onEnd();
    if (S.tutorial) await tutorialHook('end');
    showEnd();
  } else if (ev === 'phase') {
    if (S.tutorial && G.phase === 'council') { queueRender(); await sleep(300); await tutorialHook('phase:council'); }
    if (settings.speed > 0 && !meP()) { queueRender(); await sleep(Math.min(400, settings.speed)); }
    if (G.phase === 'production' && G.round > 1 && G.roundInEra === 1 && fxOn()) { queueRender(); await sleep(1700); alive(tok); }
  } else if (ev === 'start') {
    if (S.tutorial) { queueRender(); await sleep(400); await tutorialHook('start'); alive(tok); }
  }
  queueRender();
}

// ---------- replay (resume, rejoin): run the engine fast with no effects ----------
function showReplayVeil() {
  let v = document.getElementById('veil');
  if (!v) { v = document.createElement('div'); v.id = 'veil'; v.className = 'veil'; document.body.appendChild(v); }
  v.innerHTML = `<div><div class="spin"></div><b>กำลังเรียกเกมคืน</b><div class="small muted">ย้อนเล่นคำตอบที่บันทึกไว้ ${S.replayMax} ครั้ง</div></div>`;
}
function endReplay() {
  if (!S || !S.replaying) return;
  S.replaying = false; S.replay = null;
  const v = document.getElementById('veil'); if (v) v.remove();
  for (const l of G.log) l._fx = 1;
  lastStats = null; firstPaint = true;
  queueRender();
}

// ---------- save and resume (solo games; online keeps its own record for rejoining) ----------
let saveTimer = null;
const saveKey = () => S && S.mode === 'online' ? 'save.online' : 'save.solo';
function saveSoon() { if (saveTimer) return; saveTimer = setTimeout(() => { saveTimer = null; saveGame(); }, 600); }
function saveGame() {
  if (!S || !G || G.over || S.mode === 'tutorial' || S.mode === 'watch') return;
  store.set(saveKey(), { v: 1, cfg: S.cfg, log: [...S.log.entries()], takeover: S.takeover, round: G.round, era: G.era, at: Date.now(), room: S.room });
}
function clearSave() { if (S && S.mode !== 'tutorial' && S.mode !== 'watch') store.del(saveKey()); }
function resumeSolo() {
  const sv = store.get('save.solo', null); if (!sv) return showMenu();
  startGame(sv.cfg, { replay: sv.log, takeover: sv.takeover });
}

// ---------- D6 for the first player and the seating order; ties re-roll among the tied ----------
function diceOrder(n, rand) {
  const rolls = [];
  function rank(group) {
    if (group.length === 1) return group;
    const vals = group.map(() => 1 + Math.floor(rand() * 6));
    rolls.push({ who: group.slice(), vals });
    const by = {};
    group.forEach((g, k) => (by[vals[k]] = by[vals[k]] || []).push(g));
    return Object.keys(by).map(Number).sort((a, b) => b - a).reduce((acc, v) => acc.concat(rank(by[v])), []);
  }
  return { order: rank([...Array(n).keys()]), rolls };
}
const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
const dieFace = v => `<span class="die"><i class="pips">${[...Array(9).keys()].map(i => `<b class="${(PIPS[v] || []).includes(i) ? 'on' : ''}"></b>`).join('')}</i></span>`;
// show the roll; resolves once the order has been revealed (and the player clicked, unless auto)
function showDiceRoll(seats, dice, o) {
  o = o || {};
  return new Promise(resolve => {
    if (settings.autoplay) o = Object.assign({}, o, { auto: true, instant: true });
    const fast = reduceMotion() || o.instant;
    const box = openModal(`<div class="diceroll">

// buildings tucked under a project: rendered last-first so the card sits on top and the first strip peeks out nearest
function tucks(pr, o) {
  const n = Math.max(pr.d.slots, pr.buildings.length);

    else if ((l.cls === 'win' || l.cls === 'lose') && P && P !== h && /ชนะ|แพ้|รัฐประหาร/.test(l.msg)) { toast(`${pFlag(P, 'xs')}${esc(l.msg)}`, P, 3000); }

let lastStats = null;

// small choices sit in a tray at the side so the table stays visible
// =====================================================================
const POPUP_KINDS = new Set(['build', 'researchPick', 'milPick', 'milRemove', 'exploreChoose', 'bonusPick', 'labResearch', 'attach', 'regimeChoice', 'command', 'cardBuy', 'lens', 'scout', 'scoutDeck', 'cmdScout', 'annex']);
function humanAsk(P, req, seq) {
  return new Promise(resolve => {
    const id = ++pendingId;
    pending = { P, req, id, seq, resolve: v => { if (!pending || pending.id !== id) return; pending = null; hintFor = null; closeModal(); queueRender(); resolve(v); } };
    if (settings.autoplay) { setTimeout(() => { if (pending && pending.id === id) answer(aiHint(P, req)); }, 0); return; }
    if (req.kind === 'workers' && settings.autoWorkers) { answer(aiHint(P, req)); return; }
    queueRender();
  });
}
function answer(v) { if (pending) pending.resolve(v); }
let dockId = -1;
let hintFor = null;
function renderDecision() {
  renderHand(); renderTray();
  if (!pending) { dockId = -1; return; }
  if (dockId === pending.id) return;
  dockId = pending.id;
  const { req, P } = pending;
  if (req.kind === 'turn') { handHidden = false; renderHand(); return; }
  if (req.kind === 'workers') return openWorkers();
  if (req.kind === 'commerce') return openCommerce();
  if (POPUP_KINDS.has(req.kind)) return openChoice(P, req);
  renderTray();
}
function hintOf(req) {
  if (!pending) return undefined;

  const v = aiHint(pending.P, req);
  hintFor = { id: pending.id, v };
  return v;
}
const showHintNow = () => !!(S && S.tutorial);

// ---------- the hand ----------
function renderHand() {
  const box = document.getElementById('hand'); if (!box) return;
  const P = meP();
  const mine = !!(pending && pending.req.kind === 'turn' && pending.P === P);
  box.classList.toggle('up', mine && !handHidden);
  box.classList.toggle('peek', mine && handHidden);
  if (!mine) { if (box.innerHTML) { box.innerHTML = ''; box.dataset.pid = ''; } return; }
  if (box.dataset.pid === String(pending.id)) return;
  box.dataset.pid = pending.id;
  const req = pending.req, o = req.opts;
  const others = G.players.filter(q => q !== P && !q.diploPlayed).map(q => q.name);
  const ready = o.acts.map(a => `<button class="bchip" data-act="${a.uid}" data-tip="${esc(`<div class="tt">${esc(a.name)}</div><div>${gloss(a.text)}</div>`)}">${ICON('building')} กด ${esc(a.name)} <small>${esc(a.proj)}</small></button>`).join('');
  const cards = ['trade', 'military', 'research', 'diplomacy'].map((card, ci) => {

        <span class="mi">${ICON(MODE_ICON[p.mode])}</span><span class="mt"><b data-g="${esc(K.MODE_NAME[p.mode])}">${esc(K.MODE_NAME[p.mode])}</b><small>${p.ok ? esc(ACT_TEXT[p.mode]) : esc(p.why || 'ทำไม่ได้ตอนนี้')}</small></span></button>`).join('');
    const state = card === 'diplomacy' && P.diploPlayed ? 'ค้างบนโต๊ะจนสภาประชุม' : 'เล่นแล้ว รอการทูตคืนขึ้นมือ';
    return `<div class="acard a-${card}${inHand ? '' : ' used'}" style="--k:${ci}"><div class="aart">${ICON(CARD_ICON[card])}</div><div class="an">${K.CARD_NAME[card]}</div>
      ${inHand ? `<div class="modes">${modes}</div>` : `<div class="astate">${state}</div>`}</div>`;
  }).join('');
  box.innerHTML = `<div class="hand-in">
    <div class="hh"><b>ตาของคุณ</b><span class="tiny">วงที่ ${req.lap} · กดสิ่งปลูกสร้างกี่ใบก็ได้ แล้วเล่นการ์ด 1 ใบ · ชี้ที่มือเพื่อยกการ์ดขึ้น</span><span class="grow"></span>
      <button class="btn sm ghost" id="h-hint">${ICON('star')} AI แนะนำ</button><button class="btn sm ghost" id="h-hide">ซ่อนมือ</button></div>
    ${ready ? `<div class="bchips">${ready}</div>` : ''}
    <div class="hcards">${cards}</div>
    <div class="tiny muted hfoot">${others.length ? `ยังไม่เล่นการทูต: ${others.map(esc).join(', ')}` : 'ทุกรัฐอื่นเล่นการทูตแล้ว ถ้าคุณเล่นการทูต ขั้นบริหารจบทันที'}</div></div>
    <button class="handtab" id="h-show">${ICON('trade')} ตาของคุณ · แสดงมือ</button>`;
  box.querySelectorAll('[data-card]').forEach(b => b.onclick = () => { sfx('card'); answer({ type: 'play', card: b.dataset.card, mode: b.dataset.mode }); });
  box.querySelector('#h-hide').onclick = () => { handHidden = true; box.classList.remove('up'); box.classList.add('peek'); };
  box.querySelector('#h-show').onclick = () => { handHidden = false; box.classList.add('up'); box.classList.remove('peek'); };
  const markHint = () => {

    if (!v) return;
    const el = v.type === 'activate' ? box.querySelector(`.bchip[data-act="${v.uid}"]`) : box.querySelector(`[data-card="${v.card}"][data-mode="${v.mode}"]`);
    if (el) el.classList.add('hint');

  box.classList.add('raised'); setTimeout(() => box.classList.remove('raised'), 1600);
  box.onclick = e => { if (!e.target.closest('button')) box.classList.toggle('raised'); };
  if (fxOn()) sfx('card');
}

// ---------- popup for card choices ----------
function oddsHtml(p) { const c = p >= 60 ? 'good' : p >= 40 ? 'warnc' : 'bad'; return `<div class="odds ${c}">โอกาสชนะ <b>${p}%</b></div>`; }
const oddsCache = {};
function commandOdds(P, o) {
  return aiIso(() => {
    const v = o.value;
    if (v.t === 'attack') return K.simOdds(G, P, { P: G.players[v.pid] }, o.pr.d.mil, 'attack', 300);
    if (v.t === 'coup') { const def = K.coupDefender(G, P); return K.simOdds(G, P, def ? { P: def } : { neutral: true }, G.era + 2, 'coup', 400); }
    const deck = G.projectDecks[G.era]; if (!deck.length) return 0;
    const cnt = {}; for (const c of deck) cnt[c.d.mil] = (cnt[c.d.mil] || 0) + 1;
    let p = 0; for (const size of Object.keys(cnt)) p += cnt[size] / deck.length * K.simOdds(G, P, { neutral: true }, +size, 'explore', 300);
    return p;
  });
}
function optionInner(P, req, o, i) {

  if ((k === 'researchPick') && o.card) return researchCardHtml(o.card, { cost: o.cost || o.card.d.cost });

  if (k === 'regimeChoice' && o.reg) {
    const vals = G.players.map(q => K.metricOf(G, q, o.value));

    return regimeCardHtml(o.reg, { small: true, extra: `<div class="pv">${G.players.map((q, j) => `<span style="--pc:${q.color}">${pFlag(q, 'xs')}${vals[j]} <b>+${pts[j]}</b></span>`).join('')}</div>` });
  }
  if (k === 'command') {

    if (v.t === 'attack') return `<div class="tgt">${pFlag(o.S)}<b>${esc(o.S.name)}</b></div>${projCardHtml(o.pr, { P: o.S, bare: true })}<div class="os">${esc(o.sub)}</div>${odds}`;

// ---------- production: click worker slots on your own cards ----------
let wState = null;
function openWorkers() {
  if (!pending || pending.req.kind !== 'workers') return;
  const P = pending.P;
  if (!wState || wState.id !== pending.id) { const sug = aiHint(P, pending.req); wState = { id: pending.id, w: Object.assign({}, sug.w), lamp: sug.lamp }; }
  drawWorkers();
}
function workerPreview(P, w, lamp) {
  const lampOk = K.has(P, 'โคมไฟกริดมานา');
  const order = P.projects.slice().sort((x, y) => Object.keys(y.d.inp).length - Object.keys(x.d.inp).length);
  const stock = { mat: K.goodsOf(P, 'mat'), fuel: K.goodsOf(P, 'fuel'), food: K.goodsOf(P, 'food') };
  const res = {};
  for (const pr of order) {
    const n = w[pr.uid] || 0;
    const need = pr.d.workers - (lampOk && lamp === pr.uid ? 1 : 0);
    if (n < need || (n === 0 && need > 0)) { res[pr.uid] = { ok: false, why: n ? 'แรงงานไม่ครบ' : 'ไม่ผลิต' }; continue; }
    const inp = pr.d.inp; let ok = true;
    for (const t of Object.keys(inp)) if (stock[t] < inp[t]) ok = false;
    if (!ok) { res[pr.uid] = { ok: false, why: 'วัตถุดิบนำเข้าไม่พอ' }; continue; }
    for (const t of Object.keys(inp)) stock[t] -= inp[t];
    const room = pr.d.out === 'grav' ? 99 : 6 - pr.goods;
    res[pr.uid] = { ok: true, gain: Math.min(pr.d.outN, room), capped: pr.d.out !== 'grav' && room < pr.d.outN };
  }
  return res;
}
function drawWorkers() {
  const P = pending.P, W = K.totalWorkers(P);
  const lampOk = K.has(P, 'โคมไฟกริดมานา');
  const used = Object.values(wState.w).reduce((a, b) => a + b, 0);
  const pv = workerPreview(P, wState.w, wState.lamp);
  const tot = { mat: 0, fuel: 0, food: 0, grav: 0 };
  for (const pr of P.projects) if (pv[pr.uid] && pv[pr.uid].ok) tot[pr.d.out] += pv[pr.uid].gain;
  let pool = ''; for (let i = 0; i < W; i++) pool += `<span class="mslot${i < W - used ? ' on' : ''}" style="--pc:${P.color}">${ICON('worker')}</span>`;
  const cards = P.projects.map(pr => {
    const r = pv[pr.uid] || {};
    const view = Object.assign({}, pr, { workers: wState.w[pr.uid] || 0 });
    return `<div class="wcard${r.ok ? ' ok' : ''}">${projCardHtml(view, { P, bare: true, workerSlots: true })}
      <div class="wres ${r.ok ? 'good' : 'muted'}">${r.ok ? `ผลิต +${r.gain}${r.capped ? ' (ชนเพดาน 6)' : ''}` : esc(r.why || '')}</div>
      ${lampOk && pr.d.workers > 0 ? `<label class="tiny"><input type="radio" name="lamp" value="${pr.uid}" ${wState.lamp === pr.uid ? 'checked' : ''}> โคมไฟ</label>` : ''}</div>`;
  }).join('');
  const box = openModal(`<div class="choice"><div class="ch-head"><h2>ขั้นผลิต รอบที่ ${G.round}: วางแรงงาน</h2><button class="btn sm ghost" id="c-peek">${ICON('eye')} ดูโต๊ะ</button></div>
    <p class="small muted">คลิกช่องคนบนการ์ดเพื่อวางหรือถอนแรงงาน โครงการผลิตเมื่อแรงงานครบทุกช่อง${lampOk ? ' · โคมไฟกริดมานาให้โครงการ 1 ใบผลิตได้แม้ขาดแรงงาน 1 คน' : ''} ค่าที่แสดงยังไม่รวมโบนัสจากการ์ดวิจัย</p>
    <div class="wpool"><span class="lbl">แรงงานว่าง ${W - used}/${W}</span>${pool}${used > W ? '<span class="err">เกิน</span>' : ''}<span class="grow"></span><span>คาดว่าได้ ${costHtml(tot)}</span>${lampOk ? `<label class="tiny"><input type="radio" name="lamp" value="" ${wState.lamp ? '' : 'checked'}> ไม่ใช้โคมไฟ</label>` : ''}</div>
    <div class="wgrid">${cards}</div>
    <div class="mfoot"><button class="btn" id="w-ai">${ICON('star')} ใช้ตามที่ AI แนะนำ</button><button class="btn" id="w-clear">ถอนทั้งหมด</button><span class="grow"></span><button class="btn primary" id="w-ok" ${used > W ? 'disabled' : ''}>ยืนยัน เริ่มผลิต</button></div></div>`, 'wide choicebox');
  box.querySelectorAll('[data-w]').forEach(el => el.onclick = () => {
    const uid = +el.dataset.w, k = +el.dataset.k, cur = wState.w[uid] || 0;
    const pr = P.projects.find(p => p.uid === uid);
    let nv = k < cur ? k : k + 1;
    nv = Math.min(nv, pr.d.workers, cur + (W - used));
    wState.w[uid] = nv; sfx('tick'); drawWorkers();
  });
  box.querySelectorAll('input[name=lamp]').forEach(r => r.onchange = () => { wState.lamp = r.value ? +r.value : null; drawWorkers(); });
  box.querySelector('#w-ai').onclick = () => { const s = aiHint(P, pending.req); wState.w = Object.assign({}, s.w); wState.lamp = s.lamp; drawWorkers(); };
  box.querySelector('#w-clear').onclick = () => { wState.w = {}; wState.lamp = null; drawWorkers(); };
  box.querySelector('#w-ok').onclick = () => answer({ w: Object.assign({}, wState.w), lamp: wState.lamp });
  box.querySelector('#c-peek').onclick = peekTable;
}

// ---------- commerce ----------
let cState = null;
function openCommerce() {
  if (!pending || pending.req.kind !== 'commerce') return;
  if (!cState || cState.id !== pending.id) cState = { id: pending.id, sells: { mat: 0, fuel: 0, food: 0 }, buys: {}, central: { mat: 0, fuel: 0, food: 0 } };
  drawCommerce();
}
function commerceCalc(P) {
  const sp = K.marketSellPrice(G, P), mp = K.marketBuyPrice(G, P), cap = K.capacity(G, P, true);
  let law = K.has(P, 'กฎหมายตราชั่ง') ? 3 : 0, earned = 0;
  for (const t of GOODS) { const n = cState.sells[t]; if (!n) continue; let e = n * sp; const x = Math.min(law, n); e += x; law -= x; earned += e; }
  let spent = 0, used = 0; const paid = {};
  for (const [k, n] of Object.entries(cState.buys)) {
    if (!n) continue; const [pid, puid] = k.split(':').map(Number);
    const S2 = G.players[pid]; const pr = S2.projects.find(p => p.uid === puid); if (!pr) continue;
    const price = K.salePrice(G, S2, pr); spent += n * price; used += n; paid[pid] = (paid[pid] || 0) + n * price;
  }
  for (const t of GOODS) { spent += cState.central[t] * mp; used += cState.central[t]; }
  return { sp, mp, cap, earned, spent, used, paid, final: P.grav + earned - spent };
}
function drawCommerce() {
  const P = pending.P; const c = commerceCalc(P);
  const th = K.hvThreshold(G, P);
  const step = (key, n, max) => `<span class="stepper"><button data-k="${key}" data-d="-1" ${n <= 0 ? 'disabled' : ''}>−</button><span>${n}</span><button data-k="${key}" data-d="1" ${n >= max ? 'disabled' : ''}>+</button></span>`;
  const sellRows = GOODS.map(t => `<div class="frow">${rb(t, K.goodsOf(P, t))}<span class="tiny muted">คลัง ${P.wh[t]} · บนโครงการ ${K.goodsOf(P, t) - P.wh[t]}</span><span class="grow"></span>${step('s:' + t, cState.sells[t], K.goodsOf(P, t))}</div>`).join('');
  let buyRows = '';
  for (const S2 of G.players) {
    if (S2 === P) continue;
    const rows = S2.projects.filter(pr => pr.d.sale != null && pr.goods > 0).map(pr => {
      const key = 'b:' + S2.id + ':' + pr.uid; const n = cState.buys[S2.id + ':' + pr.uid] || 0;
      let cubes = ''; for (let i = 0; i < pr.goods; i++) cubes += `<i class="cube c-${pr.d.out}${i < n ? ' take' : ''}"></i>`;
      return `<div class="frow"><span class="pname">${esc(pr.d.name)}</span><span class="cubes">${cubes}</span><span class="tiny muted">${ICON('grav')}${K.salePrice(G, S2, pr)}</span><span class="grow"></span>${step(key, n, pr.goods)}</div>`;
    }).join('');
    const pay = c.paid[S2.id] || 0, hit = pay >= th;
    buyRows += `<div class="cstate" style="--pc:${S2.color}"><div class="cs-h">${pFlag(S2, 'sm')}<b>${esc(S2.name)}</b><span class="grow"></span><span class="hv${hit ? ' hit' : ''}" data-g="การค้ามูลค่าสูง">จ่าย ${pay}/${th}${hit ? (P.tradeBonus ? ' (รับโบนัสรอบนี้แล้ว)' : ' ถึงเกณฑ์ จั่วโบนัส') : ''}</span></div>${rows || '<div class="tiny muted">ไม่มีสินค้าค้างให้ซื้อ</div>'}</div>`;
  }
  const cenRows = GOODS.map(t => `<div class="frow">${rb(t, '')}<span class="tiny muted">ราคา ${c.mp}</span><span class="grow"></span>${step('c:' + t, cState.central[t], 99)}</div>`).join('');
  const errs = [];
  if (c.used > c.cap) errs.push('ซื้อเกินความจุ');
  if (c.final < 0) errs.push('เกรฟไม่พอ');
  const box = openModal(`<div class="choice"><div class="ch-head"><h2>${ICON('trade')} ค้าขาย</h2><button class="btn sm ghost" id="c-peek">${ICON('eye')} ดูโต๊ะ</button></div>
    <p class="small muted">ลำดับในแอคชันเดียว: ขายให้ตลาดกลาง แล้วซื้อจากรัฐอื่นตามราคาบนการ์ด แล้วซื้อจากตลาดกลาง การขายไม่กินความจุ ของที่ซื้อเข้าคลังสินค้า (จุ ${K.whCap(P)} ส่วนเกินขายทิ้งตอนจบเทิร์น)</p>
    <div class="ccols"><div class="form-sec"><h4>ขายให้ตลาดกลาง <span class="tiny muted">หน่วยละ ${c.sp}${K.has(P, 'กฎหมายตราชั่ง') ? ' (+1 สูงสุด 3 จากกฎหมายตราชั่ง)' : ''}</span></h4>${sellRows}</div>
      <div class="form-sec"><h4 data-g="ราคาขาย">ซื้อจากรัฐอื่น</h4>${buyRows}</div>
      <div class="form-sec"><h4 data-g="ตลาดกลาง">ซื้อจากตลาดกลาง</h4>${cenRows}</div></div>
    <div class="summary"><span data-g="ความจุการซื้อ">ความจุ <b>${c.used}</b>/${c.cap}</span><span>${ICON('grav')} ${P.grav} + ขาย ${c.earned} − ซื้อ ${c.spent} = <b>${c.final}</b></span>${errs.length ? `<span class="err">${errs.join(' · ')}</span>` : ''}</div>
    <div class="mfoot"><button class="btn" id="c-ai">${ICON('star')} ใช้ตามที่ AI แนะนำ</button><button class="btn" id="c-clear">ล้าง</button><button class="btn" id="c-back">กลับไปเลือกแอคชันอื่น</button><span class="grow"></span><button class="btn primary" id="c-ok" ${errs.length ? 'disabled' : ''}>ยืนยันการค้า</button></div></div>`, 'wide choicebox');
  box.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    const [kind, a, bb] = b.dataset.k.split(':'); const d = +b.dataset.d;
    if (kind === 's') cState.sells[a] = Math.max(0, cState.sells[a] + d);
    else if (kind === 'c') cState.central[a] = Math.max(0, cState.central[a] + d);
    else { const key = a + ':' + bb; cState.buys[key] = Math.max(0, (cState.buys[key] || 0) + d); }
    sfx('tick'); drawCommerce();
  });
  box.querySelector('#c-ai').onclick = () => {
    const plan = aiHint(P, pending.req) || { sells: {}, buys: [], central: {} };
    cState.sells = Object.assign({ mat: 0, fuel: 0, food: 0 }, plan.sells); cState.central = Object.assign({ mat: 0, fuel: 0, food: 0 }, plan.central); cState.buys = {};
    for (const b of plan.buys || []) cState.buys[b.pid + ':' + b.puid] = (cState.buys[b.pid + ':' + b.puid] || 0) + b.n;
    drawCommerce();
  };
  box.querySelector('#c-clear').onclick = () => { cState.sells = { mat: 0, fuel: 0, food: 0 }; cState.central = { mat: 0, fuel: 0, food: 0 }; cState.buys = {}; drawCommerce(); };
  box.querySelector('#c-back').onclick = () => { cState = null; answer(null); };
  box.querySelector('#c-peek').onclick = peekTable;
  box.querySelector('#c-ok').onclick = () => {
    const plan = { sells: Object.assign({}, cState.sells), central: Object.assign({}, cState.central), buys: [] };
    for (const [k, n] of Object.entries(cState.buys)) if (n > 0) { const [pid, puid] = k.split(':').map(Number); plan.buys.push({ pid, puid, n }); }
    cState = null; answer(plan);
  };
  if (showHintNow() && !box.dataset.h) { box.dataset.h = 1; box.querySelector('#c-ai').classList.add('hint'); }
}

// =====================================================================
// TABLE EFFECTS: the engine announces each moment ('fx' events) and waits,
// so cards, cubes, coins and meeples travel across the table before play goes on
// =====================================================================
const cubeH = t => `<i class="cube c-${t}"></i>`;
const coinH = () => `<span class="coinf">${ICON('grav')}</span>`;
const backH = (cls) => `<span class="cardback ${cls || ''}"></span>`;
const seatA = pid => anchor('seat-' + pid) ? 'seat-' + pid : null;
function stagger(n, fn, gap) { const ps = []; for (let i = 0; i < n; i++) ps.push(fn(i, i * (gap || 90))); return Promise.all(ps); }
async function handleFx(d) {
  if (S.tutorial) {
    if (d.t === 'flip') { render(); await tutorialHook('fx:flip'); }
    if (d.t === 'round' && [5, 9, 13].includes(d.round)) await tutorialHook('round:' + d.round);
  }
  if (!fxOn()) return;
  render();
  const P = d.pid != null ? G.players[d.pid] : null;
  const mine = P && isMine(P);
  switch (d.t) {
    case 'round': {
      placeRoundMarker(); pulse(anchor('track'));
      if (d.round > 1) { sfx('tick'); await fxWait(550); }
      break;
    }
    case 'play': {
      const from = mine ? { left: window.innerWidth / 2 - 60, top: window.innerHeight - 160, width: 120, height: 120 } : seatA(d.pid);
      const html = `<div class="playcard a-${d.card}"><div class="aart">${ICON(CARD_ICON[d.card])}</div><div class="an">${K.CARD_NAME[d.card]}</div><div class="am">${esc(K.MODE_NAME[d.mode])}</div></div>`;
      if (!mine) toast(`${pFlag(P, 'xs')}<b>${esc(P.name)}</b> เล่น${esc(K.CARD_NAME[d.card])} · ${esc(K.MODE_NAME[d.mode])}`, P, 1800);
      sfx('card');
      await fly(html, from, 'regime', { s0: 0.55, s1: 1, rot: mine ? 0 : -4, dur: 560, fadeOut: false, cls: 'onboard' });
      await fxWait(mine ? 150 : 420);
      break;
    }
    case 'build': {
      const el = anchor('proj-' + d.uid);
      if (el) el.classList.add('incoming');
      const pr = P.projects.find(p => p.uid === d.uid);
      sfx('card');
      if (pr) await fly(projCardHtml(pr, { bare: true }), d.annex ? 'deck-proj' : 'market', el, { s0: 1, s1: el && el.classList.contains('tiny') ? 0.45 : 0.9, dur: 700, fadeOut: false });
      if (el) { el.classList.remove('incoming'); pulse(el, 'land'); }
      burst(el, '<i class="spk"></i>', 8);
      await fxWait(200);
      break;
    }
    case 'trade': {
      const buys = d.buys || [], sells = d.sells || [], cen = d.central || [];
      const jobs = [];
      sells.forEach(s => {
        jobs.push(stagger(Math.min(5, s.n), (i, dl) => fly(cubeH(s.t), seatA(d.pid), 'central', { delay: dl, dur: 520 })));
        jobs.push(stagger(Math.min(5, Math.ceil(s.g / 2)), (i, dl) => fly(coinH(), 'central', 'grav-' + d.pid, { delay: 300 + dl, dur: 520 })));
      });
      buys.forEach(b => {
        const seller = G.players[b.sid];
        const src = anchor('proj-' + b.puid);
        burst(src, cubeH(b.t), Math.min(6, b.n + 2));
        jobs.push(stagger(Math.min(6, b.n), (i, dl) => fly(cubeH(b.t), src, 'wh-' + d.pid, { delay: dl, dur: 620, jy: -10 })));
        jobs.push(stagger(Math.min(6, Math.ceil(b.g / 2)), (i, dl) => fly(coinH(), 'grav-' + d.pid, 'grav-' + b.sid, { delay: 200 + dl, dur: 640 })));
        if (isMine(seller)) { toast(`${pFlag(P, 'xs')}<b>${esc(P.name)}</b> ซื้อ${esc(RN[b.t])} ${b.n} หน่วยจากคุณ ${ICON('grav')}+${b.g}`, P, 3000); setTimeout(() => sfx('coin'), 500); }
      });
      cen.forEach(c => {
        jobs.push(stagger(Math.min(5, Math.ceil(c.g / 2)), (i, dl) => fly(coinH(), 'grav-' + d.pid, 'central', { delay: dl, dur: 480 })));
        jobs.push(stagger(Math.min(5, c.n), (i, dl) => fly(cubeH(c.t), 'central', 'wh-' + d.pid, { delay: 250 + dl, dur: 560 })));
      });
      sfx('coin');
      await Promise.all(jobs);
      pulse(anchor('grav-' + d.pid));
      buys.forEach(b => pulse(anchor('grav-' + b.sid)));
      break;
    }
    case 'workers': {
      const src = anchor('workers-' + d.pid);
      const jobs = [];
      P.projects.forEach((pr, k) => { for (let i = 0; i < pr.workers; i++) jobs.push(fly(`<span class="mflyer" style="--pc:${P.color}">${ICON('worker')}</span>`, src, 'proj-' + pr.uid, { delay: k * 70 + i * 50, dur: 420, arc: 30 })); });
      await Promise.all(jobs);
      break;
    }
    case 'produce': {
      const jobs = [];
      (d.gains || []).forEach((g, k) => {
        if (!g.n) return;
        const el = anchor('proj-' + g.uid);
        if (g.out === 'grav') jobs.push(stagger(Math.min(4, g.n), (i, dl) => fly(coinH(), el, 'grav-' + d.pid, { delay: k * 120 + dl, dur: 520 })));
        else { const r = rectOf(el); if (r) jobs.push(stagger(Math.min(4, g.n), (i, dl) => fly(cubeH(g.out), { left: r.left + r.width / 2 - 4, top: r.top - 40, width: 8, height: 8 }, el, { delay: k * 120 + dl, dur: 380, arc: 6, fadeIn: true }))); }
        setTimeout(() => pulse(el, 'land'), k * 120 + 380);
      });
      if (jobs.length) { sfx('cube'); await Promise.all(jobs); }
      await fxWait(mine ? 150 : 60);
      break;
    }
    case 'reshuffle': {
      sfx('shuffle');
      await stagger(Math.min(6, d.n), (i, dl) => fly(backH('mil'), 'disc-' + d.pid, 'army-' + d.pid, { delay: dl, dur: 420, arc: 26, rot: i % 2 ? 8 : -8 }));
      if (mine) toast(`${ICON('military')} สับกองพัก ${d.n} ใบกลับเข้ากองทหาร`, P, 1800);
      pulse(anchor('army-' + d.pid));
      break;
    }
    case 'milGain': {
      sfx('card');
      await fly(backH('mil'), 'deck-mil', 'disc-' + d.pid, { dur: 560, rot: 6 });
      pulse(anchor('disc-' + d.pid));
      break;
    }
    case 'research': {
      const card = P.research.find(r => r.uid === d.uid);
      sfx('flip');
      if (card) await fly(researchCardHtml(card, { mini: true }), 'deck-research', 'research-' + d.pid, { dur: 620, s0: 1.4, s1: 1 });
      pulse(anchor('research-' + d.pid));
      break;
    }
    case 'attach': {
      const el = anchor('bld-' + d.uid);
      if (el) el.classList.add('incoming');
      sfx('card');
      await fly(backH('bld'), 'deck-research', el || ('proj-' + d.puid), { dur: 600 });
      if (el) { el.classList.remove('incoming'); pulse(el, 'land'); }
      break;
    }
    case 'activate': {
      const el = anchor('bld-' + d.uid);
      sfx('tick'); if (el) { el.classList.add('tapping'); burst(el, '<i class="spk"></i>', 6); }
      await fxWait(380);
      break;
    }
    case 'income': {
      sfx('coin');
      await Promise.all(G.players.map((Q, k) => stagger(2, (i, dl) => fly(coinH(), 'regime', 'grav-' + Q.id, { delay: k * 90 + dl, dur: 560 }))));
      break;
    }
    case 'score': {
      sfx('gavel');
      pulse(anchor('rail')); G.players.forEach(Q => pulse(document.getElementById('pawn-' + Q.id)));
      await fxWait(d.flip ? 900 : 700);
      break;
    }
    case 'flip': { pulse(anchor('cur-' + d.line)); await fxWait(500); break; }
    case 'hire': {
      sfx('tick');
      await fly(`<span class="mflyer" style="--pc:${P.color}">${ICON('worker')}</span>`, 'track', 'workers-' + d.pid, { dur: 560 });
      pulse(anchor('workers-' + d.pid));
      break;
    }
    case 'untap': { sfx('flip'); await fxWait(250); break; }
    case 'first': {
      const el = anchor('seat-' + d.pid);
      if (el) { await fly(`<span class="starf">${ICON('star')}</span>`, 'track', el, { dur: 600 }); pulse(el); }
      break;
    }
  }
}

// =====================================================================
// BATTLE VIEW: cards turn over one by one, attacker first, then the totals settle
// =====================================================================
const BTYPE = { explore: 'บุกเบิกดินแดน', attack: 'โจมตีรัฐอื่น', coup: 'รัฐประหาร' };
function battleTitle(res) {
  const A = res.sides[0].P;

function showBattle(res) {
  return new Promise(resolve => {
    const w = res.sides[res.winner], h = meP();
    const auto = settings.autoplay || (S && S.mode === 'online');
    const box = openModal(`<div class="battle"><div class="bt-head"><span class="bt-k">${ICON(res.type === 'coup' ? 'crown' : 'shield')} ${BTYPE[res.type]}</span><h2>${battleTitle(res)}</h2>
      <div class="small muted">ขนาดการรบ ${res.size} ใบต่อฝ่าย · เปิดสลับกัน ผู้บุกเปิดก่อน · เสมอฝ่ายรับชนะ</div></div>
      <div class="bf">${laneHtml(res, 0)}<div class="vs">VS</div>${laneHtml(res, 1)}</div>
      <div class="bwin hide" style="color:${pColor(w.P)}">${pFlag(w.P, 'sm')} ${esc(pName(w.P))} ชนะ ${res.totals[0]} ต่อ ${res.totals[1]}</div>
      <div class="mfoot"><span class="tiny muted grow" id="b-auto"></span><button class="btn" id="b-skip">เปิดทั้งหมด</button><button class="btn primary" id="b-ok">ต่อไป</button></div></div>`, 'wide battlebox');
    const seq = [], A = res.sides[0].revealed.length, B = res.sides[1].revealed.length;
    for (let k = 0; k < Math.max(A, B); k++) { if (k < A) seq.push([0, k]); if (k < B) seq.push([1, k]); }
    const run = [0, 0];
    let done = false, timer = null, idx = 0, closeT = null;
    const reveal = (x, anim) => {
      const el = box.querySelector(`[data-k="${x[0]}-${x[1]}"]`); if (!el || !el.classList.contains('back')) return;
      el.classList.remove('back'); if (anim) el.classList.add('flip');
      run[x[0]] += res.sides[x[0]].revealed[x[1]].final;
      box.querySelector(`[data-tot="${x[0]}"]`).textContent = run[x[0]];
    };
    const close = () => { done = true; clearTimeout(timer); clearTimeout(closeT); closeModal(); resolve(); };
    const finish = () => {
      if (done) return; done = true; clearTimeout(timer);
      seq.forEach(x => reveal(x, false));
      [0, 1].forEach(i => { box.querySelector(`[data-tot="${i}"]`).textContent = res.totals[i]; });
      box.querySelector(`[data-lane="${res.winner}"]`).classList.add('win');
      box.querySelector(`[data-lane="${1 - res.winner}"]`).classList.add('lose');
      box.querySelector('.bwin').classList.remove('hide');
      const sk = box.querySelector('#b-skip'); if (sk) sk.disabled = true;
      const mine = h && res.sides.some(s => s.P === h);
      sfx(mine ? (w.P === h ? 'win' : 'lose') : 'hit');
      if (auto) {
        let left = settings.autoplay ? 0 : 4;
        const tick = () => { const el = box.querySelector('#b-auto'); if (el) el.textContent = left > 0 ? `ไปต่อเองใน ${left} วินาที` : ''; if (left-- <= 0) close(); else closeT = setTimeout(tick, 1000); };
        tick();
      }
    };
    const step = () => { if (done) return; if (idx >= seq.length) { timer = setTimeout(finish, 250); return; } reveal(seq[idx++], true); sfx('flip'); timer = setTimeout(step, 430); };
    if (reduceMotion() || settings.autoplay) finish(); else timer = setTimeout(step, 300);
    box.querySelector('#b-skip').onclick = finish;
    const ok = box.querySelector('#b-ok');
    ok.focus();
    ok.onclick = () => { if (!done) { finish(); } close(); };
  });
}

let coachOpen = null;
let coachPos = null;   // where the player dragged the card; later steps open there too
// the explanation card: always inside the viewport, follows scroll and resize, scrolls its own text,
// and can be dragged by its header. The dimmed ring marks the part of the table being explained.
function coach(st) {
  if (window.__coachLog) window.__coachLog.push(st.id);
  return new Promise(resolve => {
    if (coachOpen) coachOpen.close();
    const veil = document.createElement('div'); veil.className = 'coachveil';
    const ring = document.createElement('div'); ring.className = 'coachring';
    const card = document.createElement('div'); card.className = 'coach'; card.setAttribute('role', 'dialog'); card.setAttribute('aria-label', st.title);
    const total = TUTORIAL.length, n = S && S.tutorial ? S.tutorial.seen.size : 0;
    card.innerHTML = `<div class="ck" title="ลากตรงนี้เพื่อย้ายกล่องคำอธิบาย"><span class="grip">${ICON('grip')}</span><span>${ICON('book')} โหมดสอนเล่น${n ? ` · บทที่ ${n}/${total}` : ''}</span><span class="grow"></span><button class="cmin" id="co-min" title="ย่อหรือขยายกล่อง" aria-label="ย่อหรือขยายกล่อง">${ICON('minus')}</button></div>
      <div class="cbody"><h3>${esc(st.title)}</h3>
      <div class="cs"><b>กติกา</b><p>${gloss(st.rule)}</p></div><div class="cs"><b>ทำไมถึงเป็นแบบนี้</b><p>${gloss(st.why)}</p></div><div class="cs"><b>แนวทาง</b><p>${gloss(st.how)}</p></div></div>
      <div class="cf">${S && S.tutorial ? '<button class="btn sm ghost" id="co-off">ปิดคำอธิบายที่เหลือ</button>' : ''}<span class="grow"></span><button class="btn primary" id="co-ok">เข้าใจแล้ว</button></div>`;
    document.body.appendChild(veil); document.body.appendChild(ring); document.body.appendChild(card);
    const target = st.focus && document.querySelector(st.focus);
    const fixedTarget = target && getComputedStyle(target).position === 'fixed';
    if (target && !fixedTarget) {
      const r0 = target.getBoundingClientRect();
      if (r0.top < 0 || r0.bottom > window.innerHeight) target.scrollIntoView({ block: r0.height > window.innerHeight ? 'start' : 'center' });
    }
    const M = 10;
    const clampPos = (x, y) => {
      const vw = window.innerWidth, vh = window.innerHeight, cw = card.offsetWidth, ch = card.offsetHeight;
      return { x: Math.max(M, Math.min(vw - cw - M, x)), y: Math.max(M, Math.min(vh - ch - M, y)) };
    };
    const put = (x, y) => { const p = clampPos(x, y); card.style.left = p.x + 'px'; card.style.top = p.y + 'px'; };
    // the ring follows its target; the card goes where the player left it, or next to the target
    const place = () => {
      const vw = window.innerWidth, vh = window.innerHeight;
      const tr = target ? target.getBoundingClientRect() : null;
      const visible = !!(tr && tr.width && tr.height && tr.bottom > 0 && tr.top < vh && tr.right > 0 && tr.left < vw);
      ring.style.display = visible ? '' : 'none';
      if (visible) { ring.style.left = (tr.left - 5) + 'px'; ring.style.top = (tr.top - 5) + 'px'; ring.style.width = (tr.width + 10) + 'px'; ring.style.height = (tr.height + 10) + 'px'; }
      veil.classList.toggle('clear', visible);
      if (coachPos) { put(coachPos.x, coachPos.y); return; }
      const cw = card.offsetWidth, ch = card.offsetHeight;
      let x = (vw - cw) / 2, y = (vh - ch) / 2;
      if (visible) {
        if (tr.bottom + 14 + ch <= vh - M) { y = tr.bottom + 14; x = tr.left + tr.width / 2 - cw / 2; }
        else if (tr.top - 14 - ch >= M) { y = tr.top - 14 - ch; x = tr.left + tr.width / 2 - cw / 2; }
        else if (tr.right + 16 + cw <= vw - M) { x = tr.right + 16; y = tr.top; }
        else if (tr.left - 16 - cw >= M) { x = tr.left - 16 - cw; y = tr.top; }
      }

    };

    const head = card.querySelector('.ck');
    head.addEventListener('pointerdown', e => {
      if (e.button > 0 || e.target.closest('button')) return;
      e.preventDefault();
      const r = card.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;

      const up = () => { card.classList.remove('dragging'); head.removeEventListener('pointermove', mv); head.removeEventListener('pointerup', up); head.removeEventListener('pointercancel', up); if (coachPos) coachPos = clampPos(coachPos.x, coachPos.y); };
      head.addEventListener('pointermove', mv); head.addEventListener('pointerup', up); head.addEventListener('pointercancel', up);
    });
    head.addEventListener('dblclick', e => { if (e.target.closest('button')) return; coachPos = null; place(); });
    const onKey = e => {
      if (e.isComposing) return;

    const close = () => {
      window.removeEventListener('resize', onMove); window.removeEventListener('scroll', onMove, true); document.removeEventListener('keydown', onKey);

    const off = card.querySelector('#co-off'); if (off) off.onclick = () => { if (S && S.tutorial) S.tutorial.on = false; close(); };
    place(); requestAnimationFrame(place);
    card.querySelector('#co-ok').focus({ preventScroll: true });
    if (settings.autoplay && !window.__coachManual) setTimeout(close, 0);

}

const STYLE_AXES = {
  build: { label: 'นักขยายดินแดน', line: 'สร้างและผนวกโครงการเป็นแกน' },
  trade: { label: 'พาณิชย์', line: 'ค้าขายเป็นแกน' },
  war: { label: 'ทหาร', line: 'ใช้กองทัพเป็นแกน' },
  lab: { label: 'วิทยาการ', line: 'วิจัยเป็นแกน' },
};
// read a state's play from the counts the engine kept during the game
// shares are read against a typical table (AI averages over many v0.3 games), because reform and research
// fill most turns for everyone; what marks a style is the action a state chose more often than usual
const STYLE_BASE = { build: 4.4, trade: 5.3, war: 6.9, lab: 10.3 };
function playstyle(P) {
  const st = P.st;
  const ax = { build: st.build + st.annex, trade: st.commerce, war: st.explore + st.attack + st.coup + st.reform * 0.35, lab: st.research };
  const tot = Object.values(ax).reduce((a, b) => a + b, 0) || 1, btot = Object.values(STYLE_BASE).reduce((a, b) => a + b, 0);
  const ratio = {}; for (const k in ax) ratio[k] = (ax[k] / tot) / (STYLE_BASE[k] / btot);
  const ranked = Object.keys(ratio).sort((a, b) => ratio[b] - ratio[a]);
  const main = ratio[ranked[0]] >= 1.12 ? ranked[0] : null;
  const second = main && ratio[ranked[1]] >= 1.08 && ratio[ranked[1]] >= ratio[main] - 0.25 ? ranked[1] : null;
  const label = main ? 'รัฐ' + STYLE_AXES[main].label + (second ? 'สาย' + STYLE_AXES[second].label : '') : 'รัฐสายสมดุล';
  const base = LINES.map(l => [l, K.symCount(P, l)]).sort((a, b) => b[1] - a[1])[0];
  const notes = [];
  notes.push(`สร้าง ${st.build} · ผนวก ${st.annex} · ค้าขาย ${st.commerce} · วิจัย ${st.research} · ปฏิรูป ${st.reform} · บุกเบิก ${st.explore} · โจมตี ${st.attack} · รัฐประหาร ${st.coup}`);
  if (st.bwin + st.blose) notes.push(`รบชนะ ${st.bwin} แพ้ ${st.blose}`);
  if (P.stigma === 0) notes.push('มือสะอาด ไม่มีตราบาปเลยทั้งเกม');
  if (st.plunderedFrom >= 4) notes.push(`ถูกปล้นไป ${st.plunderedFrom} หน่วย`);
  const desc = (main ? `${STYLE_AXES[main].line}มากกว่าโต๊ะทั่วไป ${Math.round((ratio[main] - 1) * 100)}%${second ? ' เสริมด้วย' + STYLE_AXES[second].label : ''}` : 'กระจายแอคชันใกล้เคียงโต๊ะทั่วไป ไม่ทุ่มทางใดทางหนึ่ง')
    + (base && base[1] > 0 ? ` · ฐานอุดมการณ์หนักไปทาง${LN[base[0]]} (${base[1]} สัญลักษณ์)` : '');
  return { key: (main || 'even') + (second ? '+' + second : ''), label, desc, notes, ratio, base: base && base[1] > 0 ? base[0] : null };
}

function hofMerge(list, add) {
  const by = new Map(list.map(r => [r.id, r]));
  for (const r of add || []) if (validRecord(r) && !by.has(r.id)) by.set(r.id, r);

function validRecord(r) {

      join: pid => { roomSend({ t: 'hello', p: pubProfile(true), want: o.rejoin ? 'rejoin' : (R.started ? 'watch' : 'seat') }, pid); if (R.host && !R.started) roomSend(rosterMsg(), pid); },
      leave: pid => roomLeave(pid),
      msg: (d, pid) => roomMsg(d, pid),
    });
  } catch (e) { console.error(e); alert('เชื่อมต่อห้องไม่ได้'); return; }
  roomSend({ t: 'hello', p: pubProfile(true), want: o.rejoin ? 'rejoin' : 'seat' });
  history.replaceState(null, '', location.pathname + location.search + '#room=' + code);
  lobbySetStatus('ห้อง ' + code);
  if (host) lobbySend(roomAd());
  if (!o.rejoin) renderRoom();
}
const rosterMsg = () => ({ t: 'roster', seats: R.seats, n: R.n, rules: R.rules, styles: R.styles, host: R.hostId });
function roomLeave(pid) {
  const owner = R.owners.get(pid); R.owners.delete(pid); R.spectators.delete(pid);
  if (owner) R.lastSeen.set(owner, Date.now());
  if (!R.started) {
    if (R.host && owner) { const i = R.seats.findIndex(s => s && s.id === owner); if (i > 0) { R.seats[i] = null; compactSeats(); roomSend(rosterMsg()); lobbySend(roomAd()); } }
    if (!R.host && owner && owner === R.hostId) { R.chat.push({ id: uid(6), leader: 'ระบบ', color: '#d6a94b', text: 'ผู้สร้างห้องออกไปแล้ว ห้องนี้ปิด', at: Date.now() }); }
    renderRoom();
  } else queueRender();
}
function compactSeats() { const h = R.seats.filter(Boolean); R.seats = h.concat(new Array(Math.max(0, R.n - h.length)).fill(null)).slice(0, R.n); }
function roomMsg(d, pid) {
  if (!d || typeof d !== 'object') return;
  switch (d.t) {
    case 'hello': {
      const p = cleanProfile(d.p); if (!p) return;
      R.owners.set(pid, p.id); R.lastSeen.delete(p.id);
      if (R.started) {
        // someone (re)joins a running game: any peer may send the record, the joiner keeps the first one

        queueRender(); return;

        if (!R.seats.some(s => s && s.id === p.id)) { const i = R.seats.findIndex((s, k) => k < R.n && !s); if (i >= 0 || R.seats.length < R.n) { if (i >= 0) R.seats[i] = p; else R.seats.push(p); } else R.spectators.add(pid); }
        compactSeats(); fixColors(); roomSend(rosterMsg()); lobbySend(roomAd());

      renderRoom(); return;
    }
    case 'roster': {
      if (R.host || R.started) return;
      R.hostId = str(d.host, 16); R.n = int(d.n) === 3 ? 3 : 4; R.rules = RULESETS[d.rules] ? d.rules : '0.3';
      R.seats = (Array.isArray(d.seats) ? d.seats : []).slice(0, 4).map(cleanProfile);
      R.styles = (Array.isArray(d.styles) ? d.styles : []).slice(0, 4).map(s => STYLE_KEYS.includes(s) ? s : 'balanced');
      renderRoom(); return;
    }
    case 'start': {
      if (R.started || R.host) return;
      const cfg = cleanCfg(d.cfg); if (!cfg) return;
      R.started = true; R.cfg = cfg; R.wantSync = false;
      beginOnlineGame(cfg); return;
    }
    case 'sync': {
      if (!R.wantSync) return;
      const cfg = cleanCfg(d.cfg); if (!cfg || !Array.isArray(d.log)) return;
      R.wantSync = false; R.started = true; R.cfg = cfg;
      const log = d.log.filter(x => Array.isArray(x) && int(x[0]) != null).map(([k, e]) => [k, cleanAns(e)]).filter(x => x[1]);
      const take = {}; if (d.take && typeof d.take === 'object') for (const k of Object.keys(d.take)) { const t = d.take[k]; if (/^\d$/.test(k) && t && int(t.from) != null) take[k] = { from: t.from, to: int(t.to) }; }
      startGame(cfg, { replay: log, takeover: take, net: gameNet(), room: R.code });
      setTimeout(reclaimMySeat, 400);
      return;
    }
    case 'ans': {
      const s = int(d.s), e = cleanAns(d.e); if (s == null || !e || R.seenAns.has(s)) return;
      R.seenAns.add(s);
      roomSend({ t: 'ans', s, e }); // relay once, so a broken link between two peers does not stall the table
      if (S) deliverAnswer(s, e);
      return;
    }
    case 'take': { const p = int(d.p), f = int(d.from); if (p != null && f != null && S) { applyTakeover(p, f); toast(`${ICON('cloak')} AI รับช่วงที่นั่งของ ${esc(G.players[p].name)}`, G.players[p], 3000); } return; }
    case 'reclaim': { const p = int(d.p); if (p != null && !R.ctl.some(c => c.reclaim === p)) R.ctl.push({ reclaim: p }); return; }
    case 'chat': { const c = cleanChat(d.c); if (c && !R.chat.some(x => x.id === c.id)) { R.chat.push(c); R.chat = R.chat.slice(-200); if (S) { S.unread = (drawerTab === 'chat') ? 0 : (S.unread || 0) + 1; renderChat(); renderChatBadge(); } else renderRoom(); sfx('chat'); } return; }
    case 'hash': { const r = int(d.r); if (r != null && S && S.hashes[r] && typeof d.h === 'string' && d.h !== S.hashes[r] && !R.warned) { R.warned = true; toast(`${ICON('x')} สถานะเกมของเพื่อนไม่ตรงกับเครื่องนี้ (รอบ ${r}) ลองออกแล้วกลับเข้าห้องเพื่อซิงก์ใหม่`, null, 6000); } return; }
    case 'bye': roomLeave(pid); return;
    case 'hofs': if (Array.isArray(d.list)) { L.hof = hofMerge(L.hof, d.list.slice(0, 20)); store.set('hof', hofMerge(hofLocal(), L.hof)); } return;
  }
}
function fixColors() {
  const used = new Set();
  R.seats.forEach(s => { if (!s) return; if (used.has(s.color)) s.color = COLORS.concat(['#5fc28a', '#e88a4f']).find(c => !used.has(c)) || s.color; used.add(s.color); });
}
function cleanCfg(c) {
  if (!c || typeof c !== 'object' || !Array.isArray(c.seats) || c.seats.length < 3 || c.seats.length > 4 || !RULESETS[c.rules] || int(c.seed) == null) return null;
  const seats = c.seats.map(s => ({ name: str(s.name, 24) || 'รัฐ', latin: str(s.latin, 24), meaning: str(s.meaning, 60), color: /^#[0-9a-f]{6}$/i.test(s.color) ? s.color : '#888888', flag: cleanFlag(s.flag), leader: str(s.leader, 30), human: !!s.human, owner: s.human ? str(s.owner, 16) : null, style: STYLE_KEYS.includes(s.style) ? s.style : 'balanced' }));
  const dice = c.dice && Array.isArray(c.dice.order) && Array.isArray(c.dice.rolls) ? { order: c.dice.order.map(int).filter(x => x != null && x < 4), rolls: c.dice.rolls.slice(0, 12).map(r => ({ who: (r.who || []).map(int).filter(x => x != null), vals: (r.vals || []).map(int).filter(x => x != null) })) } : null;
  return { mode: 'online', rules: c.rules, seed: c.seed >>> 0, seats, dice };
}
function renderRoom() {
  if (R.started || !R.code) return;
  const prevIn = document.getElementById('r-chatin'), keepTxt = prevIn ? prevIn.value : '', keepFocus = prevIn && document.activeElement === prevIn;
  setTimeout(() => { const ni = document.getElementById('r-chatin'); if (ni && keepTxt && !ni.value) ni.value = keepTxt; if (ni && keepFocus) ni.focus(); }, 0);
  const lu = new URL(location.href); lu.searchParams.delete('ns'); lu.hash = 'room=' + R.code;
  const link = lu.toString();
  const seats = [];
  for (let i = 0; i < R.n; i++) {
    const s = R.seats[i];
    seats.push(s ? `<div class="sseat${s.id === pubId() ? ' me' : ''}" style="--pc:${esc(s.color)}">${flagHtml(s, 'lg')}<div><b>${esc(s.state || 'ชื่อสุ่มอัลธาลานี')}</b><div class="tiny muted">${esc(s.leader)}${s.id === R.hostId ? ' · ผู้สร้างห้อง' : ''}${s.id === pubId() ? ' · คุณ' : ''}</div></div></div>`
      : `<div class="sseat empty"><span class="flag lg ghostflag">${ICON('cloak')}</span><div class="grow"><b>ที่นั่งว่าง</b><div class="tiny muted">ถ้าเริ่มเกมตอนนี้ AI เล่นแทน</div>${R.host ? `<select data-style="${i}">${STYLE_KEYS.map(k => `<option value="${k}"${R.styles[i] === k ? ' selected' : ''}>${esc(AI.STYLES[k].name)}</option>`).join('')}</select>` : ''}</div></div>`);
  }
  app.innerHTML = `<div class="page room"><div class="page-h"><button class="btn sm" id="r-back">ออกจากห้อง</button><h1>ห้อง ${esc(R.code)}</h1><span class="grow"></span><button class="btn sm" id="r-copy">คัดลอกลิงก์ชวนเพื่อน</button></div>
    <div class="lgrid two"><div class="box"><h2>ที่นั่ง</h2><div class="sseats">${seats.join('')}</div>
      ${R.host ? `<div class="kv" style="margin-top:12px"><label for="r-n">จำนวนรัฐ</label><span><select id="r-n"><option value="3"${R.n === 3 ? ' selected' : ''}>3 รัฐ</option><option value="4"${R.n === 4 ? ' selected' : ''}>4 รัฐ</option></select></span>
        <label for="r-rules">ชุดกฎ</label><span><select id="r-rules">${rulesetOpts(R.rules)}</select></span></div>
        <div class="row" style="margin-top:14px"><button class="btn primary big" id="r-start">${ICON('dice')} ทอยลูกเต๋าและเริ่มเกม</button></div>`
      : `<p class="small muted">${R.hostId ? 'รอผู้สร้างห้องเริ่มเกม' : 'กำลังติดต่อผู้สร้างห้อง'} · ชุดกฎ ${esc((RULESETS[R.rules] || {}).label || '')}</p>`}
      <p class="tiny muted">ลิงก์ห้อง: <code>${esc(link)}</code></p></div>
      <div class="box"><h2>แชทในห้อง</h2><div id="r-chat" class="chatlog">${R.chat.map(chatLine).join('') || '<p class="tiny muted">ทักทายเพื่อนร่วมโต๊ะได้ที่นี่</p>'}</div><form id="r-chatf" class="chatform"><input id="r-chatin" maxlength="300" autocomplete="off" placeholder="พิมพ์ข้อความ"><button class="btn sm primary">ส่ง</button></form></div></div></div>`;
  const q = s => app.querySelector(s);
  q('#r-back').onclick = () => { closeGameRoom(); history.replaceState(null, '', location.pathname + location.search); showLobby(); };
  q('#r-copy').onclick = async () => { try { await navigator.clipboard.writeText(link); q('#r-copy').textContent = 'คัดลอกแล้ว'; } catch (e) { exportText('ลิงก์ห้อง', 'room.txt', link); } };
  q('#r-chatf').onsubmit = e => { e.preventDefault(); const inp = q('#r-chatin'); const t = inp.value.trim(); if (t) { inp.value = ''; sendChat(t); renderRoom(); } };
  const ch = q('#r-chat'); ch.scrollTop = ch.scrollHeight;

  }
}
function hostStart() {
  const seed = (crypto.getRandomValues(new Uint32Array(1))[0]) >>> 0;
  const r = K.rng(seed ^ 0x9a3e);
  const draft = [];
  for (let i = 0; i < R.n; i++) {
    const p = R.seats[i];
    if (p) { const nm = p.state ? { th: p.state, latin: p.latin, meaning: p.meaning } : althName(r); draft.push({ name: nm.th, latin: nm.latin || '', meaning: nm.meaning || '', color: p.color, flag: p.flag, leader: p.leader, human: true, owner: p.id, style: 'balanced' }); }
    else { const n = althName(r), lp = althPerson(r); draft.push({ name: n.th, latin: n.latin, meaning: n.meaning, color: COLORS.find(c => !draft.some(d => d.color === c) && !R.seats.some(s => s && s.color === c)) || COLORS[i], flag: { seed: (r() * 2 ** 31) >>> 0 }, leader: 'ท่าน' + lp.th, human: false, owner: null, style: R.styles[i] || 'balanced' }); }
  }
  const dice = diceOrder(draft.length, K.rng(seed ^ 0xd1ce));
  const cfg = { mode: 'online', rules: R.rules, seed, seats: orderSeats(draft, dice), dice };
  R.started = true; R.cfg = cfg;
  lobbySend({ t: 'unroom', code: R.code });
  roomSend({ t: 'start', cfg });
  beginOnlineGame(cfg);
}
// the roll is shown from the draft order the host used; every peer sees the same dice
function beginOnlineGame(cfg) {
  lobbySetStatus('กำลังเล่น ห้อง ' + R.code);
  const ordered = cfg.seats;
  const draft = cfg.dice && cfg.dice.order.length === ordered.length ? (() => { const d = new Array(ordered.length); cfg.dice.order.forEach((si, pos) => { d[si] = ordered[pos]; }); return d; })() : ordered;
  const go = () => startGame({ mode: 'online', rules: cfg.rules, seed: cfg.seed, seats: ordered, dice: cfg.dice }, { net: gameNet(), room: R.code });
  if (cfg.dice && !settings.autoplay) showDiceRoll(draft, cfg.dice, { auto: true }).then(go); else go();
}
function sendChat(text) {
  const c = { id: uid(8), by: pubId(), leader: profile.leader, color: profile.color, text: text.slice(0, 300), at: Date.now() };
  R.chat.push(c); roomSend({ t: 'chat', c });
  if (S) { renderChat(); }
}
// the adapter the session talks to
function gameNet() {
  return {
    attach(s) {
      s.me = pubId();
      clearInterval(R.takeTimer);
      R.takeTimer = setInterval(checkTakeover, 3000);
    },
    sendAnswer(seq, pid, e) {
      if (R.ctl.length) { e.c = R.ctl.splice(0); }
      R.seenAns.add(seq);
      roomSend({ t: 'ans', s: seq, p: pid, e });
    },
    chat: sendChat,
    leave() { clearInterval(R.takeTimer); closeGameRoom(); lobbySetStatus('ในล็อบบี้'); },
    onEnd() { clearInterval(R.takeTimer); },
    shareRecord(rec) { roomSend({ t: 'hofs', list: [rec] }); lobbySend({ t: 'hofs', list: [rec] }); },
    onRound(round, h) { roomSend({ t: 'hash', r: round, h }); },
  };
}
// the connected human with the lowest seat acts for the table when someone drops
function actingHost() {
  if (!S || !S.cfg) return false;
  const online = new Set([...R.owners.values(), pubId()]);
  const seat = S.cfg.seats.find(s => s.human && online.has(s.owner));
  return !!seat && seat.owner === pubId();
}
function checkTakeover() {
  if (!S || !G || G.over || !S.waiting || !actingHost()) return;
  const P = G.players[S.waiting.pid], owner = seatOf(P).owner;
  if ([...R.owners.values()].includes(owner)) return;
  const gone = R.lastSeen.get(owner) || (R.lastSeen.set(owner, Date.now()), Date.now());
  if (Date.now() - gone < 20000) return;
  const from = S.waiting.seq;
  roomSend({ t: 'take', p: P.id, from });
  applyTakeover(P.id, from);
  toast(`${ICON('cloak')} ${esc(leaderOf(P))} หลุดจากห้อง AI รับช่วงที่นั่งนี้จนกว่าจะกลับมา`, P, 3500);
}
// back in the room after a refresh: ask for our seat back; the next human answer carries the hand-over
function reclaimMySeat() {
  if (!S || !G) return;
  const P = meP(); if (!P) return;
  const tk = S.takeover[P.id]; if (!tk || tk.to != null) return;
  const humansOnline = S.cfg.seats.some(s => s.human && s.owner !== pubId() && [...R.owners.values()].includes(s.owner));
  if (!humansOnline) { tk.to = S.seq; queueRender(); return; }
  roomSend({ t: 'reclaim', p: P.id });

function rejoinOnline(save) {
  if (!save || !save.room) return showLobby();
  lobbyConnect();
  R.wantSync = true;
  openGameRoom(save.room, false, { rejoin: true });
  app.innerHTML = `<div class="page"><div class="box center"><div class="spin"></div><h2>กำลังกลับเข้าห้อง ${esc(save.room)}</h2><p class="small muted">ขอบันทึกเกมจากเพื่อนร่วมโต๊ะ ถ้าไม่มีใครอยู่ในห้อง เกมจะเล่นต่อจากที่บันทึกไว้ในเครื่องนี้ โดยให้ AI เล่นแทนที่นั่งที่ว่าง</p><button class="btn" id="rj-solo">เล่นต่อจากบันทึกในเครื่อง</button></div></div>`;
  const local = () => {
    if (!R.wantSync) return; R.wantSync = false; R.started = true;
    const take = Object.assign({}, save.takeover || {});
    const after = Math.max(0, ...save.log.map(x => +x[0]));
    save.cfg.seats.forEach((s, i) => { if (s.human && s.owner !== pubId() && !take[i]) take[i] = { from: after + 1, to: null }; });
    startGame(save.cfg, { replay: save.log, takeover: take, net: gameNet(), room: save.room });
  };
  app.querySelector('#rj-solo').onclick = local;
  setTimeout(local, 8000);
}
function onlineDot(P) {
  const owner = seatOf(P) && seatOf(P).owner;
  const on = [...R.owners.values()].includes(owner);
  const tk = S && S.takeover[P.id] && S.takeover[P.id].to == null;
  return ` <span class="odot ${on ? 'on' : 'off'}" title="${on ? 'ออนไลน์' : 'หลุดจากห้อง'}"></span>${tk ? ' <span class="tiny">AI เล่นแทน</span>' : ''}`;
}
function renderChat() {
  const box = document.getElementById('chatlog'); if (!box) return;
  const atB = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
  setHTML(box, R.chat.map(chatLine).join('') || '<p class="tiny muted">ยังไม่มีข้อความ</p>');

}
function renderChatBadge() {

  b.textContent = S.unread || ''; b.classList.toggle('hidden', !S.unread);
}
// a compact fingerprint of the public state, compared between peers after each council
function stateHash() {
  return hashStr(JSON.stringify([G.round, G.regime, G.currents, G.market.map(p => p.uid), G.players.map(P => [P.legit, P.stigma, P.grav, P.wh, P.projects.map(p => [p.uid, p.goods, p.buildings.length]), P.research.length, P.army.deck.length + P.army.disc.length])])).toString(36);
}

window.UI = { menu: showMenu, state: () => G, session: () => S, answer, settings, startGame, profile: () => profile, hof: hofLocal, room: () => R, lobby: () => L, pending: () => pending };
if (/room=/.test(location.hash) && netAvailable()) needProfile(showLobby); else showMenu();

})();
