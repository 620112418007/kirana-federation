name: บันทึกหอเกียรติยศและความคิดเห็น
# issue ที่ชื่อขึ้นต้นด้วย [HOF] หรือ [COMMENT] จะถูกตรวจแล้วรวมเข้า data/*.json จากนั้นตอบกลับและปิด issue
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: records
  cancel-in-progress: false
jobs:
  record:
    if: startsWith(github.event.issue.title, '[HOF]') || startsWith(github.event.issue.title, '[COMMENT]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ตรวจและรวมข้อมูล
        # ส่งเนื้อ issue ผ่านตัวแปรแวดล้อมเท่านั้น ไม่แทรกลงคำสั่ง shell ตรง ๆ
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: node scripts/records.js
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "ไม่มีข้อมูลใหม่"
          else
            git commit -m "records: issue #${{ github.event.issue.number }}"
            git pull --rebase
            git push
          fi
      - name: ตอบกลับและปิด issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('result.txt') ? fs.readFileSync('result.txt', 'utf8') : 'บันทึกแล้ว';
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed' });
